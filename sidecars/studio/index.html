          const rolePill = document.createElement('span');
          rolePill.className = `cd-role-pill ${item.isSideQuestion ? 'is-btw' : 'is-main'}`;
          rolePill.textContent = item.isSideQuestion ? c.liveBtwRole : c.liveMainRole;
          actRow.appendChild(rolePill);

          const actSpan = document.createElement('span');
          actSpan.className = `cd-live-action${actInfo.cls ? ' ' + actInfo.cls : ''}`;
          actSpan.textContent = actInfo.tag;
          actRow.appendChild(actSpan);

          if (item.activity?.batch && item.activity.batch.total >= 2) {
            const bp = document.createElement('span');
            bp.className = 'cd-batch-pill';
            bp.textContent = `[${item.activity.batch.done}/${item.activity.batch.total}]`;
            actRow.appendChild(bp);
          }

          if (item.activity?.detail) {
            const det = document.createElement('span');
            det.className = 'cd-live-detail';
            det.textContent = `· ${item.activity.detail}`;
            det.title = item.activity.detail;
            actRow.appendChild(det);
          }
          wrap.appendChild(actRow);

          if (item.stepCount > 0 || (item.isSideQuestion && item.parentTitle)) {
            const metaRow = document.createElement('div');
            metaRow.className = 'cd-live-meta-row';
            const parts = [];
            if (item.stepCount > 0) {
              parts.push(
                lang === 'en'
                  ? `Step ${item.stepCount}`
                  : lang === 'ja'
                  ? `${item.stepCount} ステップ`
                  : `第 ${item.stepCount} 步`

              parts.push(c.liveBtwParent(item.parentTitle));

          const metaRow = document.createElement('div');

              : `${c.liveIdleTag} · 共 ${item.stepCount} 步`;

        }

        if (subList.length > 0 && isSubsOpen) {
          const box = document.createElement('div');
          box.className = 'cd-sub-list';
          let subIdx = 0;
          let swarmIdx = 0;
          for (const sub of subList) {
            const sRow = document.createElement('div');
            sRow.className = 'cd-sub-row';

            const isSwarm = sub.kind === 'swarm';
            if (isSwarm) swarmIdx += 1;
            else subIdx += 1;
            const num = isSwarm ? swarmIdx : subIdx;
            const colorIdx = (isSwarm ? swarmIdx + 1 : subIdx - 1) % 5;

            const badge = document.createElement('span');
            badge.className = `cd-sub-badge c${colorIdx}`;
            badge.textContent = `${isSwarm ? c.liveSwarmPrefix : c.liveSubPrefix}${num}`;

            const name = document.createElement('span');
            name.className = 'cd-sub-name';
            name.textContent = sub.title || 'Subagent';

            steps.textContent = sub.stepCount > 0 ? c.liveStepShort(sub.stepCount) : '—';

            sRow.appendChild(name);
            sRow.appendChild(st);
            sRow.appendChild(steps);
            box.appendChild(sRow);
          }
          wrap.appendChild(box);
        }

        listEl.appendChild(wrap);

      if (running.length > 0) {
        for (const item of running) renderItem(item, true);
      } else if (recent.length > 0) {
        const preferred =
          !isConversationUnbound && activeConversationId
            ? recent.find((item) => item && item.id === activeConversationId) || recent[0]
            : recent[0];
        renderItem(preferred, false);
      } else {
        const empty = document.createElement('div');
        empty.className = 'cd-empty';
        empty.textContent = c.liveNoRunning;
        listEl.appendChild(empty);
      }
    }

    async function triggerSideQuestionOpen(payload = {}) {
      if (isConversationUnbound) return;
      const lang = currentConfig?.language || 'zh-CN';
      const c = getOverviewExtrasCopy(lang);
      const targetConvoId =
        String(payload?.conversationId || activeConversationId || liveTasksState.sideQuestionConvoId || '').trim();
      if (!targetConvoId) return;
      try {
        const res = await apiFetch('/api/side-question/open', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversationId: targetConvoId,
            cascadeId: payload?.cascadeId || '',
            tabId: payload?.tabId || '',
            index: Number.isInteger(payload?.index) ? payload.index : null,
            forceNew: Boolean(payload?.forceNew),
          }),
        });
        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.ok) {
          const reason = String(data?.reason || data?.action || '').trim();
          if (reason === 'draft_present') {
            showToast(c.btwDraftToast || c.btwFailedToast, 'err');
          } else {
            showToast(c.btwFailedToast, 'err');
          }
          return;
        }
        setTimeout(() => {
          loadLiveTasks().catch(() => {});
        }, 350);
      } catch {
        showToast(c.btwFailedToast, 'err');
      }
    }

      const head = document.createElement('div');
      head.className = 'cd-btw-head';
      const heading = document.createElement('span');

      head.appendChild(heading);
      block.appendChild(head);

      const list = document.createElement('div');

      if (items.length === 0) {
        const row = document.createElement('button');

        const sub = document.createElement('span');
        sub.className = 'cd-btw-sub';
        sub.textContent = c.btwEmptySub;
        copy.appendChild(sub);
        left.appendChild(copy);

        const right = document.createElement('span');
        right.className = 'cd-btw-row-right';
        const arrow = document.createElement('span');
        arrow.className = 'cd-btw-arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.innerHTML = arrowSvg;
        right.appendChild(arrow);

        row.appendChild(left);

        row.addEventListener('click', () => {
          triggerSideQuestionOpen({ conversationId: convoId, forceNew: true });

      for (const sq of items.slice(0, 5)) {

        copy.className = 'cd-btw-copy';

        title.className = 'cd-btw-title';
        title.textContent = sq.question || c.btwUntitled;
        copy.appendChild(title);
        left.appendChild(copy);

        const right = document.createElement('span');
        right.className = 'cd-btw-row-right';

        const isOpen = Boolean(sq.isOpenTab && !sq.minimized);

        st.textContent = isRunning ? c.btwRunningState : isOpen ? c.btwOpenState : c.btwClosedState;
        const arrow = document.createElement('span');
        arrow.className = 'cd-btw-arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.innerHTML = arrowSvg;
        right.appendChild(st);
        right.appendChild(arrow);

        row.appendChild(left);
        row.appendChild(right);
        row.addEventListener('click', () => {
          triggerSideQuestionOpen({
            conversationId: convoId,
            cascadeId: sq.cascadeId || '',

            index: Number.isInteger(sq.index) ? sq.index : null,
            forceNew: false,
          });

        list.appendChild(row);
      }
      block.appendChild(list);

    let liveTasksReqSeq = 0;

    async function loadLiveTasks() {
      const reqConvoId = activeConversationId || '';
      const reqUnbound = isConversationUnbound;
      const reqSeq = ++liveTasksReqSeq;
      try {
        const res = await apiFetch('/api/live-tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationId: reqConvoId, unbound: reqUnbound }),
        });
        if (!res.ok) return;
        const data = await res.json();
        if (reqSeq !== liveTasksReqSeq || reqConvoId !== (activeConversationId || '') || reqUnbound !== isConversationUnbound) return;
        if (data && data.ok) {
          liveTasksState = data;
          renderLiveTasksCard();
        }
      } catch {}
    }

    function openScriptForm(script = null) {
      const box = document.getElementById('script-form-box');
      if (!box) return;
      document.getElementById('script-field-id').value = script?.id || '';

    function renderScriptsCard() {
      const lang = currentConfig?.language || 'zh-CN';
      const c = getOverviewExtrasCopy(lang);
      const sec = document.getElementById('scripts-section');
      const head = document.getElementById('scripts-head');
      if (sec && head) {
        const isCollapsed = collapsedGroups.has('scripts');
        sec.classList.toggle('is-collapsed', isCollapsed);
        head.setAttribute('aria-expanded', String(!isCollapsed));
      }
      const titleEl = document.getElementById('scripts-title');
      setSectionTitle(titleEl, 'scripts', c.scriptsTitle);
      const badgeEl = document.getElementById('scripts-badge');
      if (badgeEl) badgeEl.textContent = c.scriptsCount(customScripts.length);

      const mapLbl = {
        'btn-script-add-lbl': c.btnAdd,
        'script-lbl-name': c.lblName,
        'script-lbl-path': c.lblPath,
        'script-lbl-cmd': c.lblCmd,
        'script-lbl-timeout': c.lblTimeout,
        'script-lbl-args': c.lblArgs,
        'script-lbl-cwd': c.lblCwd,
        'btn-script-save': c.btnSave,
        'btn-script-cancel': c.btnCancel,
      };
      for (const [id, txt] of Object.entries(mapLbl)) {
        const el = document.getElementById(id);
        if (el) el.textContent = txt;
      }

      const listEl = document.getElementById('scripts-list');
      if (!listEl) return;
      listEl.innerHTML = '';
      if (!customScripts.length) {
        const empty = document.createElement('div');
        empty.className = 'live-task-empty';
        empty.textContent = c.scriptsEmpty;
        listEl.appendChild(empty);
        return;
      }

      for (const sc of customScripts) {
        const card = document.createElement('div');
        card.className = 'script-card';
        const top = document.createElement('div');
        top.className = 'script-top';

        const wrap = document.createElement('div');
        wrap.className = 'script-title-wrap';
        const nameEl = document.createElement('div');
        nameEl.className = 'script-name';
        nameEl.textContent = sc.name;
        nameEl.title = sc.scriptPath || sc.command || sc.name;

        const metaEl = document.createElement('div');
        metaEl.className = 'script-meta';
        if (sc.lastRunAt) {
          const stSpan = document.createElement('span');
          const ok = sc.lastExitCode === 0;
          stSpan.className = ok ? 'script-status-ok' : 'script-status-err';
          stSpan.textContent = ok ? c.statusOk(sc.lastDurationMs || 0) : c.statusErr(sc.lastExitCode);
          metaEl.appendChild(stSpan);
          const rel = formatRelTimeShort(sc.lastRunAt, lang);
          if (rel) metaEl.appendChild(document.createTextNode(` · ${rel}`));
          if (sc.lastSummary) metaEl.appendChild(document.createTextNode(` · ${sc.lastSummary}`));
        } else {
          const shortPath = (sc.scriptPath || sc.command || '').split(/[\\/]/).slice(-2).join('/');
          metaEl.textContent = shortPath ? `${c.statusNever} · ${shortPath}` : c.statusNever;
        }
        wrap.appendChild(nameEl);
        wrap.appendChild(metaEl);

        const btns = document.createElement('div');
        btns.className = 'script-btns';
        const isRunning = scriptRunningIds.has(sc.id);

        const runBtn = document.createElement('button');
        runBtn.type = 'button';
        runBtn.className = 'script-mini-btn is-run';
        runBtn.disabled = isRunning;
        runBtn.textContent = isRunning ? c.btnRunning : c.btnRun;
        runBtn.addEventListener('click', () => void triggerRunScript(sc.id));

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'script-mini-btn';
        editBtn.textContent = c.btnEdit;
        editBtn.addEventListener('click', () => openScriptForm(sc));

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'script-mini-btn is-del';
        delBtn.textContent = c.btnDel;
        delBtn.addEventListener('click', () => void triggerDeleteScript(sc.id));

        btns.appendChild(runBtn);
        btns.appendChild(editBtn);
        btns.appendChild(delBtn);

        top.appendChild(wrap);
        top.appendChild(btns);
        card.appendChild(top);

        const runOut = scriptRunOutputs.get(sc.id);
        if (runOut) {
          const outBox = document.createElement('div');
          outBox.className = 'script-output-box';
          const outHead = document.createElement('div');
          outHead.className = 'script-output-head';
          const outStat = document.createElement('span');
          outStat.className = runOut.ok ? 'script-status-ok' : 'script-status-err';
          outStat.textContent = runOut.ok ? c.statusOk(runOut.durationMs || 0) : c.statusErr(runOut.exitCode);
          const outBtns = document.createElement('div');
          outBtns.className = 'script-btns';
          const showChatBtn = document.createElement('button');
          showChatBtn.type = 'button';
          showChatBtn.className = 'script-mini-btn';
          showChatBtn.textContent = c.btnShowInChat;
          showChatBtn.addEventListener('click', () => {
            void showScriptOutputInChatView(sc.name, runOut);
          });
          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className = 'script-mini-btn';
          copyBtn.textContent = c.btnCopy;
          copyBtn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(runOut.combined || '');
              showToast(c.toastCopied);
            } catch {}
          });
          const hideBtn = document.createElement('button');
          hideBtn.type = 'button';
          hideBtn.className = 'script-mini-btn';
          hideBtn.textContent = runOut.collapsed ? c.btnExpand : c.btnHide;
          hideBtn.addEventListener('click', () => {
            runOut.collapsed = !runOut.collapsed;
            renderScriptsCard();
          });
          outBtns.appendChild(showChatBtn);
          outBtns.appendChild(copyBtn);
          outBtns.appendChild(hideBtn);
          outHead.appendChild(outStat);
          outHead.appendChild(outBtns);

          outBox.appendChild(outHead);
          if (!runOut.collapsed) {
            const pre = document.createElement('pre');
            pre.className = 'script-output-pre';
            pre.textContent = runOut.combined || '(empty output)';
            outBox.appendChild(pre);
          }
          card.appendChild(outBox);
        }

        listEl.appendChild(card);
      }

    async function loadScripts() {
      try {
        const res = await apiFetch('/api/scripts/list');
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.ok && Array.isArray(data.scripts)) {
          customScripts = data.scripts;
          renderScriptsCard();
        }
      } catch {}
    }

    async function triggerSaveScript() {
      const c = getOverviewExtrasCopy(currentConfig?.language || 'zh-CN');
      const payload = {
        id: document.getElementById('script-field-id').value.trim() || undefined,
        name: document.getElementById('script-field-name').value.trim(),
        scriptPath: document.getElementById('script-field-path').value.trim(),
        command: document.getElementById('script-field-cmd').value.trim(),
        args: document.getElementById('script-field-args').value.trim(),
        cwd: document.getElementById('script-field-cwd').value.trim(),
        timeoutSec: Number(document.getElementById('script-field-timeout').value) || 60,
      };
      if (!payload.name || (!payload.scriptPath && !payload.command)) {
        showToast(c.toastInvalid);
        return;
      }
      try {
        const res = await apiFetch('/api/scripts', {
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data?.ok) {
          customScripts = data.scripts || [];
          closeScriptForm();
          renderScriptsCard();
          showToast(c.toastSaved);
        } else {
          showToast(data?.error || 'Error');
        }
      } catch (err) {
        showToast(err?.message || 'Error');
      }
    }

    async function triggerDeleteScript(id) {
      const c = getOverviewExtrasCopy(currentConfig?.language || 'zh-CN');
      try {
        const res = await apiFetch('/api/scripts/delete', {
          body: JSON.stringify({ id }),
        });
        const data = await res.json();
        if (data?.ok) {
          customScripts = data.scripts || [];
          scriptRunOutputs.delete(id);
          renderScriptsCard();
          showToast(c.toastDeleted);
        }
      } catch {}
    }

    async function showScriptOutputInChatView(name, runOut) {
      if (!runOut) return;
      try {
        await apiFetch('/api/scripts/show-in-chat', {
          body: JSON.stringify({
            name: String(name || 'Script Output'),
            ok: Boolean(runOut.ok),
            exitCode: runOut.exitCode ?? 0,
            durationMs: runOut.durationMs ?? 0,
            combined: runOut.combined || '',
          }),
        });
      } catch {
        // Sidecar fallback output remains visible even if host chat card is unavailable
      }
    }

    async function triggerRunScript(id) {
      if (scriptRunningIds.has(id)) return;
      const scMeta = customScripts.find((item) => item.id === id);
      scriptRunningIds.add(id);
      renderScriptsCard();
      let finalRunOut = null;
      try {
        const res = await apiFetch('/api/scripts/run', {
          body: JSON.stringify({ id }),
        });
        const data = await res.json();
        const combined = [data?.stdout || '', data?.stderr ? `[stderr]\n${data.stderr}` : '']
          .filter(Boolean)
          .join('\n')
          .trim() || data?.message || data?.error || '';
        finalRunOut = {
          ok: Boolean(data?.ok),
          exitCode: data?.exitCode ?? -1,
          durationMs: data?.durationMs ?? 0,
          combined,
        };
        scriptRunOutputs.set(id, finalRunOut);
        await loadScripts();
      } catch (err) {
        finalRunOut = {
          ok: false,
          exitCode: -1,
          durationMs: 0,
          combined: err?.message || String(err),
        };
        scriptRunOutputs.set(id, finalRunOut);
      } finally {
        scriptRunningIds.delete(id);
        renderScriptsCard();
        if (finalRunOut) {
          void showScriptOutputInChatView(scMeta?.name || id, finalRunOut);
        }
      }
    }

    function isAllowedParentOrigin(origin) {
      if (!origin || origin === 'null') return true;
      if (window.location.origin && window.location.origin !== 'null' && origin === window.location.origin) return true;
      return /^(?:vscode-webview|vscode-file|file|plugin):/i.test(origin) || /^https?:\/\/(?:\[::1\]|127\.0\.0\.1|localhost)(?::\d+)?$/i.test(origin);
    }

    window.addEventListener('message', (ev) => {
      if (ev.source !== window.parent) return;
      if (!isAllowedParentOrigin(ev.origin)) return;
      const msg = ev.data;
      if (!msg || typeof msg !== 'object' || msg.type !== 'ag-cs:active-conversation') return;
      if (typeof msg.conversationId !== 'string') return;
      const nextCid = msg.conversationId.trim();
      const nextUnbound = Boolean(msg.unbound) || nextCid === '';
      if (!nextUnbound && !/^[0-9a-f-]{8,64}$/i.test(nextCid)) return;
      if (nextUnbound) {
        if (isConversationUnbound && activeConversationId === '') return;
        activeConversationId = '';
        isConversationUnbound = true;
      } else {
        if (!isConversationUnbound && nextCid === activeConversationId) return;
        activeConversationId = nextCid;
        isConversationUnbound = false;

    function formatCtxTokens(n) {
      const v = Number(n || 0);
      if (v >= 1000000) {
        const m = v / 1000000;
        return Number.isInteger(m) ? `${m}M` : `${m.toFixed(1).replace(/\.0$/, '')}M`;
      }
      if (v >= 1000) {
        const k = v / 1000;
        return k >= 100 ? `${Math.round(k)}K` : `${k.toFixed(1).replace(/\.0$/, '')}K`;
      }
      return String(Math.round(v));
    }

    function formatCtxPct(p) {
      const v = Number(p || 0);
      if (v <= 0) return '0%';
      if (v < 0.1) return '<0.1%';
      return `${v.toFixed(1)}%`;
    }

    function middleTruncateText(raw, maxLen = 24, headLen = 11, tailLen = 10) {
      const s = String(raw || '').trim();
      if (!s || s.length <= maxLen) return s;
      const safeHead = Math.max(4, Math.min(headLen, s.length - 4));
      const safeTail = Math.max(4, Math.min(tailLen, s.length - safeHead));
      return `${s.slice(0, safeHead)}...${s.slice(s.length - safeTail)}`;
    }

    function shortenParentPath(p) {
      const s = String(p || '').trim();
      if (!s || s.length <= 20) return s;
      const parts = s.split(/[\\/]/).filter(Boolean);
      const tail = parts.length > 0 ? parts[parts.length - 1] : '';
      if (tail && tail.length <= 14 && s.length > 20) {
        const prefix = s.slice(0, Math.min(6, Math.max(4, s.length - tail.length - 3)));
        return `${prefix}...${tail}`;
      }
      return middleTruncateText(s, 20, 6, 11);
    }

    function shortenBranchName(b) {
      return middleTruncateText(b, 24, 12, 10);
    }

    let envPopoverAnchor = null;

    function getActiveEnvWorktree(env) {
      const list = Array.isArray(env?.worktrees) ? env.worktrees : [];
      if (!list.length) return null;
      return list.find((wt) => wt && wt.active) || list[0] || null;
    }

    function getEffectiveEnvBranchInfo(env) {
      const activeWt = getActiveEnvWorktree(env);
      const branch = String(activeWt?.branch || env?.branch || '').trim();
      const worktreePath = String(activeWt?.path || env?.worktreePath || '').trim();
      const worktreeRel = String(activeWt?.relPath || '').trim();
      const actionPath = worktreePath || String(env?.fullPath || '').trim();
      const inferredRecent = Boolean(activeWt ? activeWt.inferredRecent : env?.inferredRecent);
      return { activeWt, branch, worktreePath, worktreeRel, actionPath, inferredRecent };
    }

      const metaEl = document.getElementById('cd-env-tooltip-meta');
      const env = inspectorState?.environment || {};
      if (!tip || !anchorEl || envPopoverKind) return;
      const { branch, worktreeRel, inferredRecent } = getEffectiveEnvBranchInfo(env);
      if (!branch) {
        hideBranchTooltip();
        return;
      }
      const lang = currentConfig?.language || 'zh-CN';
      const ic = getInspectorCopy(lang);
      if (titleEl) titleEl.textContent = ic.branchTooltipTitle || 'Branch';
      if (valueEl) valueEl.textContent = branch;
      if (metaEl) {
        const metaParts = [];
        if (worktreeRel) metaParts.push(worktreeRel);
        if (inferredRecent) metaParts.push(ic.recentWorktreeTag);
        if (metaParts.length > 0) {
          metaEl.textContent = metaParts.join(' · ');
          metaEl.hidden = false;
        } else {
          metaEl.textContent = '';
          metaEl.hidden = true;
        }
      }
      tip.hidden = false;
      tip.classList.remove('is-visible');
      const rect = anchorEl.getBoundingClientRect();
      const tipRect = tip.getBoundingClientRect();
      const pad = 8;
      let left = Math.max(pad, Math.min(rect.left, window.innerWidth - tipRect.width - pad));
      let top = rect.top - tipRect.height - 6;
      if (top < pad) {
        top = Math.min(window.innerHeight - tipRect.height - pad, rect.bottom + 6);
      }
      tip.style.left = `${Math.round(left)}px`;
      tip.style.top = `${Math.round(top)}px`;
      requestAnimationFrame(() => {
        if (!tip.hidden && !envPopoverKind) tip.classList.add('is-visible');
      });
    }

    function closeEnvPopover({ restoreFocus = false } = {}) {
      const prevAnchor = envPopoverAnchor;
      const pop = document.getElementById('cd-env-popover');
      if (pop) {
        pop.hidden = true;
        pop.innerHTML = '';
        pop.style.maxHeight = '';
      }
      document.getElementById('cd-env-ws-row')?.classList.remove('is-menu-open');
      document.getElementById('cd-env-ws-row')?.setAttribute('aria-expanded', 'false');
      document.getElementById('cd-env-branch-btn')?.classList.remove('is-menu-open');
      document.getElementById('cd-env-branch-btn')?.setAttribute('aria-expanded', 'false');
      envPopoverKind = '';
      envPopoverAnchor = null;
      if (restoreFocus && prevAnchor && prevAnchor.isConnected && typeof prevAnchor.focus === 'function') {
        try {
          prevAnchor.focus({ preventScroll: true });
        } catch {
          prevAnchor.focus();
        }
      }
    }

    async function copyEnvText(text, okMsg) {
      const value = String(text || '');
      if (!value) return;
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(value);
          showToast(okMsg);
          return;
        }
      } catch {}
      try {
        const ta = document.createElement('textarea');
        ta.value = value;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast(okMsg);
      } catch {}
    }

    async function runEnvAction(payload, failMsg, expectedConvoId = activeConversationId) {
      if (isConversationUnbound || expectedConvoId !== activeConversationId) {
        return;
      }
      try {
        const res = await apiFetch('/api/env/action', {
          body: JSON.stringify(payload || {}),
        });
        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.ok) {
          showToast(failMsg || 'Action failed');
        }
      } catch {
        showToast(failMsg || 'Action failed');
      }
    }

    function openEnvPopover(kind, anchorEl, { keepOpen = false } = {}) {
      const pop = document.getElementById('cd-env-popover');
      const env = inspectorState?.environment || {};
      if (!pop || !anchorEl || isConversationUnbound || !inspectorState) return;
      if (!keepOpen && envPopoverKind === kind && !pop.hidden) {
        closeEnvPopover({ restoreFocus: true });
        return;
      }
      closeEnvPopover();
      hideBranchTooltip();
      const menuConvoId = activeConversationId;

      const lang = currentConfig?.language || 'zh-CN';
      const ic = getInspectorCopy(lang);
      const showLabel =
        env.platform === 'darwin'
          ? ic.menuShowFinder
          : env.platform === 'linux'
          ? ic.menuShowFiles
          : ic.menuShowExplorer;
      const addItem = (label, onClick) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cd-env-menu-item';
        btn.setAttribute('role', 'menuitem');
        btn.textContent = label;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeEnvPopover({ restoreFocus: true });
          if (isConversationUnbound || menuConvoId !== activeConversationId) return;
          void onClick();
        });
        pop.appendChild(btn);
      };
      const addSep = () => {
        const sep = document.createElement('div');
        sep.className = 'cd-env-menu-sep';
        sep.setAttribute('role', 'separator');
        pop.appendChild(sep);
      };
      const addLabel = (text) => {
        const lbl = document.createElement('div');
        lbl.className = 'cd-env-menu-label';
        lbl.textContent = text;
        pop.appendChild(lbl);
      };

      if (kind === 'workspace') {
        if (!env.fullPath) return;
        addItem(showLabel, () => runEnvAction({ action: 'reveal', path: env.fullPath }, ic.actionFail, menuConvoId));
        if (env.repoWebUrl) {
          addItem(
            env.isGitHub ? ic.menuOpenGithub : ic.menuOpenRepo,
            () => runEnvAction({ action: 'open-repo', url: env.repoWebUrl }, ic.actionFail, menuConvoId)
          );
        }
        addSep();
        addItem(ic.menuCopyPath, () => copyEnvText(env.fullPath, ic.copiedPath));
        addSep();
        addItem(ic.menuOpenTerminal, () => runEnvAction({ action: 'terminal', path: env.fullPath }, ic.actionFail, menuConvoId));
      } else if (kind === 'branch') {
        const { activeWt, branch, worktreePath, actionPath } = getEffectiveEnvBranchInfo(env);
        if (!branch) return;
        addItem(ic.menuCopyBranch, () => copyEnvText(branch, ic.copiedBranch));
        if (actionPath) {
          addSep();
          if (worktreePath && worktreePath !== env.fullPath) {
            addItem(showLabel, () => runEnvAction({ action: 'reveal', path: worktreePath }, ic.actionFail, menuConvoId));
          }
          addItem(ic.menuOpenTerminal, () => runEnvAction({ action: 'terminal', path: actionPath }, ic.actionFail, menuConvoId));
        }
        const wtList = Array.isArray(env.worktrees) ? env.worktrees : [];
        if (wtList.length > 1) {
          addSep();
          addLabel(ic.worktreesHeading(wtList.length));
          for (const wt of wtList) {
            if (!wt?.path || !wt?.branch) continue;
            const isCurrent = Boolean(activeWt && activeWt.path === wt.path);
            const row = document.createElement('div');
            row.className = `cd-env-wt-row${isCurrent ? ' is-active' : ''}`;
            row.title = `${wt.branch}${wt.relPath ? ` (${wt.relPath})` : ''}`;

            const left = document.createElement('span');
            left.className = 'cd-env-wt-left';
            const dot = document.createElement('span');
            dot.className = 'cd-env-wt-dot';
            const br = document.createElement('span');
            br.className = 'cd-env-wt-branch';
            br.textContent = wt.branch;
            left.appendChild(dot);
            left.appendChild(br);

            const sub = document.createElement('span');
            sub.className = 'cd-env-wt-sub';
            sub.textContent = wt.name || '';

            row.appendChild(left);
            row.appendChild(sub);
            pop.appendChild(row);
          }
        }
      } else {
        return;
      }

      pop.hidden = false;
      anchorEl.classList.add('is-menu-open');
      anchorEl.setAttribute('aria-expanded', 'true');
      envPopoverKind = kind;
      envPopoverAnchor = anchorEl;

      const pad = 8;
      const rect = anchorEl.getBoundingClientRect();
      const belowAvail = Math.max(0, window.innerHeight - rect.bottom - 5 - pad);
      const aboveAvail = Math.max(0, rect.top - 5 - pad);
      const maxViewportAvail = Math.max(0, window.innerHeight - pad * 2);
      const preferredMax = Math.min(320, maxViewportAvail);
      pop.style.maxHeight = `${Math.round(preferredMax)}px`;

      const popRect = pop.getBoundingClientRect();
      let left = Math.max(pad, Math.min(rect.left, window.innerWidth - popRect.width - pad));
      let top = rect.bottom + 5;
      if (top + popRect.height > window.innerHeight - pad) {
        if (aboveAvail > belowAvail) {
          const fitAbove = Math.min(preferredMax, Math.max(0, aboveAvail));
          if (popRect.height > fitAbove) {
            pop.style.maxHeight = `${Math.round(fitAbove)}px`;
          }
          const updatedRect = pop.getBoundingClientRect();
          top = Math.max(pad, rect.top - updatedRect.height - 5);
        } else {
          const fitBelow = Math.min(preferredMax, Math.max(0, belowAvail));
          if (popRect.height > fitBelow) {
            pop.style.maxHeight = `${Math.round(fitBelow)}px`;
          }
          const updatedRect = pop.getBoundingClientRect();
          top = Math.max(pad, Math.min(rect.bottom + 5, window.innerHeight - updatedRect.height - pad));
        }
      }
      pop.style.left = `${Math.round(left)}px`;
      pop.style.top = `${Math.round(top)}px`;
    }

    function renderConversationInspector() {
      const lang = currentConfig?.language || 'zh-CN';

      // Environment workspace & Git branch (Claude Desktop-style interactive rows)

          branchRow.hidden = true;

      // Context breakdown
      const ctx = data?.context || {};
      const modelEl = document.getElementById('cd-ctx-model');

      const pctEl = document.getElementById('cd-ctx-pct');

      const barEl = document.getElementById('cd-ctx-bar');
      const rowsEl = document.getElementById('cd-ctx-rows');

      if (ctx.available && ctx.maxTokens > 0) {
        const pctNum = Number(ctx.usedPct || 0);
        const pctStr = pctNum >= 10 ? pctNum.toFixed(1).replace(/\.0$/, '') : pctNum.toFixed(1);
        if (pctEl) pctEl.textContent = ic.usedPct(pctStr);
        if (ratioEl) ratioEl.textContent = `${formatCtxTokens(ctx.usedTokens)} / ${formatCtxTokens(ctx.maxTokens)}`;
        if (barEl) {
          barEl.innerHTML = '';
          const segs = Array.isArray(ctx.segments) ? ctx.segments : [];
          for (const seg of segs) {
            if (!(seg.tokens > 0)) continue;
            const div = document.createElement('div');
            div.className = 'cd-ctx-seg';
            div.style.width = `${Math.max(0.4, Math.min(100, seg.pct || 0))}%`;
            div.style.background = CTX_SEGMENT_COLORS[seg.key] || CTX_SEGMENT_COLORS.other;
            div.title = `${ic.seg[seg.key] || seg.key}: ${formatCtxTokens(seg.tokens)} (${formatCtxPct(seg.pct)})`;
            barEl.appendChild(div);
          }
        }
        if (rowsEl) {
          rowsEl.innerHTML = '';
          const segs = Array.isArray(ctx.segments) ? ctx.segments : [];
          for (const seg of segs) {
            if (!(seg.tokens > 0)) continue;
            const row = document.createElement('div');
            row.className = 'cd-ctx-row';
            const left = document.createElement('div');
            left.className = 'cd-ctx-label-wrap';
            const sw = document.createElement('span');
            sw.className = 'cd-swatch';
            sw.style.background = CTX_SEGMENT_COLORS[seg.key] || CTX_SEGMENT_COLORS.other;
            const lbl = document.createElement('span');
            lbl.className = 'cd-ctx-label';
            lbl.textContent = ic.seg[seg.key] || seg.key;
            left.appendChild(sw);
            left.appendChild(lbl);

            const val = document.createElement('span');
            val.className = 'cd-ctx-val';
            val.textContent = formatCtxTokens(seg.tokens);

            const p = document.createElement('span');
            p.className = 'cd-ctx-p';
            p.textContent = formatCtxPct(seg.pct);

            row.appendChild(left);
            row.appendChild(val);
            row.appendChild(p);
            rowsEl.appendChild(row);

          // Free space row
          const freeRow = document.createElement('div');
          freeRow.className = 'cd-ctx-row is-free';
          const fLeft = document.createElement('div');
          fLeft.className = 'cd-ctx-label-wrap';
          const fSw = document.createElement('span');
          fSw.className = 'cd-swatch';
          fSw.style.background = 'var(--control-hover)';
          fSw.style.border = '1px solid var(--border-col)';
          const fLbl = document.createElement('span');
          fLbl.className = 'cd-ctx-label';
          fLbl.textContent = ic.freeSpace;
          fLeft.appendChild(fSw);
          fLeft.appendChild(fLbl);

          const fVal = document.createElement('span');
          fVal.className = 'cd-ctx-val';
          fVal.textContent = formatCtxTokens(ctx.freeTokens);

          const fPct = document.createElement('span');
          fPct.className = 'cd-ctx-p';
          fPct.textContent = formatCtxPct(ctx.freePct);

          freeRow.appendChild(fLeft);
          freeRow.appendChild(fVal);
          freeRow.appendChild(fPct);
          rowsEl.appendChild(freeRow);
        }
      } else {
        if (pctEl) pctEl.textContent = '—';
        if (ratioEl) ratioEl.textContent = ic.noContext;
        if (barEl) barEl.innerHTML = '';
        if (rowsEl) rowsEl.innerHTML = '';

      // Expandable MCP tools list
      const mcpTools = Array.isArray(data?.mcpTools) ? data.mcpTools : [];
      setText('cd-mcp-count', String(mcpTools.length));
      const mcpBtn = document.getElementById('cd-mcp-toggle');

      if (mcpBtn && mcpList) {

        if (inspectorExpanded.mcp) {

            const e = document.createElement('div');
            e.className = 'cd-empty';
            e.textContent = ic.noneItems;
            mcpList.appendChild(e);
          } else {
            for (const item of mcpTools) {

              r.className = 'cd-expand-item';

              n.className = 'cd-expand-item-name';

              const s = document.createElement('span');
              s.className = 'cd-expand-item-sub';
              s.textContent = item.server;
              r.appendChild(n);
              r.appendChild(s);
              mcpList.appendChild(r);

      }

      // Expandable Skills & Rules list
      const skills = Array.isArray(data?.skills) ? data.skills : [];
      const rules = Array.isArray(data?.rules) ? data.rules : [];
      setText('cd-skills-count', String(skills.length + rules.length));
      const skBtn = document.getElementById('cd-skills-toggle');
      const skList = document.getElementById('cd-skills-list');
      if (skBtn && skList) {
        skBtn.setAttribute('aria-expanded', String(inspectorExpanded.skills));
        skList.hidden = !inspectorExpanded.skills;
        if (inspectorExpanded.skills) {
          skList.innerHTML = '';
          if (!skills.length && !rules.length) {
            const e = document.createElement('div');
            e.className = 'cd-empty';
            e.textContent = ic.noneItems;
            skList.appendChild(e);
          } else {
            for (const rl of rules) {
              const r = document.createElement('div');
              r.className = 'cd-expand-item';
              const n = document.createElement('span');
              n.className = 'cd-expand-item-name';
              n.textContent = rl.name;
              const s = document.createElement('span');
              s.className = 'cd-expand-item-sub';
              s.textContent = ic.ruleTag;
              r.appendChild(n);
              r.appendChild(s);
              skList.appendChild(r);

              s.className = 'cd-expand-item-sub';
              s.textContent = ic.skillTag;
              r.appendChild(n);
              r.appendChild(s);
              skList.appendChild(r);

              r.appendChild(n);
              r.appendChild(s);
              connList.appendChild(r);
            }

      }
    }

    let inspectorReqSeq = 0;
    let inspectorInFlight = null;

    async function loadConversationInspector() {
      if (isConversationUnbound) return;
      const reqConvoId = activeConversationId;
      if (inspectorInFlight && inspectorInFlight.convoId === reqConvoId) {
        return inspectorInFlight.promise;
      }
      const reqSeq = ++inspectorReqSeq;
      const run = (async () => {
        try {
          const res = await apiFetch('/api/conversation-inspector', {
            body: JSON.stringify({ conversationId: reqConvoId }),
          });
          if (!res.ok) return;
          const data = await res.json();
          if (reqSeq !== inspectorReqSeq || reqConvoId !== activeConversationId || isConversationUnbound) return;
          if (data?.ok) {
            inspectorState = data;
            renderConversationInspector();
          }
        } catch {}
      })();
      const entry = { convoId: reqConvoId, promise: run };
      inspectorInFlight = entry;
      try {
        await run;
      } finally {
        if (inspectorInFlight === entry) inspectorInFlight = null;
      }
    }

        void loadConversationInspector();
      }
    }, 5000);
  </script>
