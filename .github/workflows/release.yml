name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.0). Leave empty to use v<package.json version>.'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Save release as draft'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine release tag and flags
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${PKG_VER}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected a tag starting with 'v' (e.g. v2.2.0)."
            exit 1
          fi

          VERSION="${TAG#v}"
          node --input-type=module - "$VERSION" <<'EOF'
          import fs from 'node:fs';

          const tagVer = process.argv[2];
          const csSetup = fs.readFileSync('installer/setup/Program.cs', 'utf8');
          const csSetupFallback = csSetup.match(/const string FallbackVersion = "([^"]+)"/)?.[1];
          const csSetupExtraVers = [...csSetup.matchAll(/"(\d+\.\d+\.\d+)"/g)]
            .map((m) => m[1])
            .filter((v) => v !== csSetupFallback);
          const csSetupVer = csSetupExtraVers.length === 0 ? csSetupFallback : `drift:${csSetupExtraVers.join(',')}`;
          const checks = [
            ['package.json', JSON.parse(fs.readFileSync('package.json', 'utf8')).version],
            ['plugin.json', JSON.parse(fs.readFileSync('plugin.json', 'utf8')).version],
            ['src/cdp.js', fs.readFileSync('src/cdp.js', 'utf8').match(/const PLUGIN_VERSION = '([^']+)'/)?.[1]],
            ['installer/common/CdpClient.cs', fs.readFileSync('installer/common/CdpClient.cs', 'utf8').match(/GetString\(raw, "version", "([^"]+)"\)/)?.[1]],
            ['installer/setup/Program.cs', csSetupVer],
            ['installer/macos/Common/CdpClient.swift', fs.readFileSync('installer/macos/Common/CdpClient.swift', 'utf8').match(/raw\["version"\]\?\.stringValue \?\? "([^"]+)"/)?.[1]],
          ];

          const mismatches = checks.filter(([, ver]) => ver !== tagVer);
          if (mismatches.length > 0) {
            for (const [file, ver] of mismatches) {
              console.error(`::error::Release version (${tagVer}) does not match ${file} (${ver ?? 'missing'}).`);
            }
            process.exit(1);
          }
          EOF

          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          if [ "$INPUT_DRAFT" = "true" ]; then
            DRAFT="true"
          else
            DRAFT="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=$TAG version=$VERSION prerelease=$PRERELEASE draft=$DRAFT"

  build-and-test:
    name: Test & Build Artifacts
    needs: prepare
    uses: ./.github/workflows/_build-and-test.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      artifact_retention_days: 14

  release:
    name: Publish GitHub Release
    needs: [prepare, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'windows-x64'
          path: release-assets
          merge-multiple: true

      - name: Download cross-platform plugin ZIP
        uses: actions/download-artifact@v4
        with:
          pattern: 'plugin-zip'
          path: release-assets
          merge-multiple: true

      - name: Verify artifacts and generate SHA256 checksums
        env:
          WIN_FILE: ${{ needs.build-and-test.outputs.windows_file }}
          PLUGIN_ZIP: ${{ needs.build-and-test.outputs.plugin_zip_file }}
        run: |
          set -euo pipefail
          cd release-assets
          test -f "$WIN_FILE" || { echo "::error::Missing Windows artifact: $WIN_FILE"; exit 1; }
          test -f "$PLUGIN_ZIP" || { echo "::error::Missing Plugin ZIP artifact: $PLUGIN_ZIP"; exit 1; }
          ls -lh "$WIN_FILE" "$PLUGIN_ZIP"
          sha256sum "$WIN_FILE" "$PLUGIN_ZIP" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare Release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          WIN_FILE: ${{ needs.build-and-test.outputs.windows_file }}
          PLUGIN_ZIP: ${{ needs.build-and-test.outputs.plugin_zip_file }}
        run: |
          set -euo pipefail
          : > release-notes.md
          HAS_CHANGELOG=0
          if [ -f CHANGELOG.md ] && command -v python3 >/dev/null 2>&1; then
            if python3 - "$TAG" <<'PY' > changelog-section.md; then
          import re
          import sys

          tag = sys.argv[1].strip()
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read().replace('\r\n', '\n')

          clean_ver = tag.lstrip('vV')
          pattern = re.compile(r'^##\s+\[?v?' + re.escape(clean_ver) + r'\]?(?:\s+-\s+.*|\s*)$', re.MULTILINE)
          m = pattern.search(text)
          if not m:
              sys.exit(1)

          start = m.end()
          nxt = re.search(r'^##\s+', text[start:], re.MULTILINE)
          body = text[start:start + nxt.start()] if nxt else text[start:]
          body = re.sub(r'\n+---\s*$', '', body.strip())
          if not body:
              sys.exit(1)

          print(body)
          PY
              {
                cat changelog-section.md
                echo ""
                echo "---"
                echo ""
              } >> release-notes.md
              HAS_CHANGELOG=1
            fi
          fi

          cat >> release-notes.md <<EOF
          ## 下载与安装 / Downloads & Install

          本版本采用 **Antigravity 原生插件架构**，安装后即可在右侧栏使用完整的三栏控制室（对话、工具、设置）、手机推送提醒、本地脚本工具箱、内置技能与顶栏一键更新。

          - **Windows 一键安装器（推荐）**：下载 \`${WIN_FILE}\` 双击运行，自动清理旧版 \`v2.1.0 / v2.2.0 / v2.2.1\` 遗留守护进程与旧版插件（完整保留个人配置、推送凭据与自定义脚本），自动部署并启用原生插件，同时创建带定制图标的桌面与开始菜单启动入口。
          - **macOS / Linux / 跨平台通用插件包**：下载 \`${PLUGIN_ZIP}\` 解压至 \`~/.gemini/config/plugins/\`（形成 \`~/.gemini/config/plugins/agy-claude-studio\`），重启开启本地调试端口的 Antigravity 并在插件列表中启用即可；也可以直接把仓库链接发给 Antigravity 里的 Gemini 自动完成安装。
            > 维护者目前没有 Mac 真机环境，macOS/Linux 暂不提供独立打包安装器，请使用通用插件包或由 Gemini 按仓库说明协助安装。
          - **已安装原生插件的用户**：直接在 Antigravity 右侧 **Claude Studio** 面板顶栏点击「升级」即可原地无损更新。

          ### SHA256 Checksums
          \`\`\`text
          EOF
          cat release-assets/SHA256SUMS.txt >> release-notes.md
          echo '```' >> release-notes.md
          echo "HAS_CHANGELOG=$HAS_CHANGELOG" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          IS_DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --prerelease="$IS_PRERELEASE" \
              --draft="$IS_DRAFT"
            gh release upload "$TAG" release-assets/* --clobber
          else
            CREATE_ARGS=(
              --target "${{ github.sha }}"
              --title "$TAG"
              --notes-file release-notes.md
            )
            if [ "${HAS_CHANGELOG:-0}" != "1" ]; then
              CREATE_ARGS+=(--generate-notes)
            fi
            if [ "$IS_PRERELEASE" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            if [ "$IS_DRAFT" = "true" ]; then
              CREATE_ARGS+=(--draft)
            fi
            gh release create "$TAG" release-assets/* "${CREATE_ARGS[@]}"
          fi
